<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haunted Horizon — Interactive RGB Motion Halloween Background</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #07030d;
            font-family: 'Inter', sans-serif;
            color: #f8fafc;
        }
        .font-spooky {
            font-family: 'Creepster', cursive;
            letter-spacing: 0.06em;
        }
        #sceneCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }
        .hud-glass {
            background: rgba(13, 8, 22, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(249, 115, 22, 0.28);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 25px rgba(249, 115, 22, 0.12);
        }
        input[type="range"] {
            accent-color: #f97316;
        }
        #hudPanel::-webkit-scrollbar {
            width: 6px;
        }
        #hudPanel::-webkit-scrollbar-track {
            background: rgba(15, 10, 25, 0.4);
        }
        #hudPanel::-webkit-scrollbar-thumb {
            background: rgba(249, 115, 22, 0.4);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

    <!-- Primary Fullscreen Halloween Scene Canvas -->
    <canvas id="sceneCanvas"></canvas>

    <!-- Hidden Video Element for Live Webcam RGB Stream -->
    <video id="webcamVideo" playsinline autoplay muted class="hidden"></video>

    <!-- Top-Left Ambient Status & Quick Toggle Bar (Starts completely hidden) -->
    <div id="topLeftBar" class="fixed top-4 left-4 z-30 flex items-center gap-2.5 opacity-0 pointer-events-none transition-all duration-300">
        <button id="toggleHudBtn" class="hud-glass px-3.5 py-2.5 rounded-xl flex items-center gap-2 text-sm font-medium text-orange-300 hover:text-orange-200 hover:border-orange-400/60 transition-all shadow-lg" title="Toggle Control Panel (Shortcut: H or Double-Click)">
            <i class="ph-fill ph-sliders-horizontal text-lg text-orange-400"></i>
            <span id="toggleHudText">Controls</span>
        </button>

        <div id="statusBadge" class="hud-glass px-3.5 py-2 rounded-xl flex items-center gap-2 text-xs font-medium border border-amber-500/30">
            <span id="statusDot" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping"></span>
            <span id="statusDotSolid" class="w-2.5 h-2.5 rounded-full bg-amber-400 -ml-4"></span>
            <span id="statusLabel" class="text-amber-200">Initializing RGB Camera...</span>
        </div>
    </div>

    <!-- Top-Right Quick Action Buttons (Starts completely hidden) -->
    <div id="topRightBar" class="fixed top-4 right-4 z-30 flex items-center gap-2.5 opacity-0 pointer-events-none transition-all duration-300">
        <button id="flipCameraQuickBtn" class="hud-glass px-3.5 py-2.5 rounded-xl flex items-center gap-2 text-xs sm:text-sm font-medium text-orange-300 hover:text-white hover:border-orange-400/60 transition-all" title="Inverse Camera Left/Right (Shortcut: F1)">
            <i class="ph-bold ph-arrows-left-right text-orange-400 text-lg"></i>
            <span id="flipQuickLabel" class="hidden sm:inline">L/R: Mirrored</span>
        </button>
        <button id="lightningBtn" class="hud-glass px-3.5 py-2.5 rounded-xl flex items-center gap-2 text-xs sm:text-sm font-medium text-purple-300 hover:text-white hover:border-purple-400/60 transition-all" title="Trigger Thunder & Scare Burst (Shortcut: Space)">
            <i class="ph-fill ph-lightning text-amber-400 text-lg"></i>
            <span class="hidden sm:inline">Thunder Scare</span>
        </button>
        <button id="audioToggleBtn" class="hud-glass px-3.5 py-2.5 rounded-xl flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-300 hover:text-white hover:border-orange-400/60 transition-all" title="Toggle Procedural Spooky Synth Audio">
            <i id="audioIcon" class="ph-fill ph-speaker-slash text-slate-400 text-lg"></i>
            <span id="audioLabel" class="hidden sm:inline">Sound Off</span>
        </button>
    </div>

    <!-- Main Toggleable HUD Control Panel (Starts completely hidden) -->
    <aside id="hudPanel" class="fixed top-16 left-4 z-30 w-80 sm:w-96 max-h-[calc(100vh-5rem)] overflow-y-auto hud-glass rounded-2xl p-5 transition-all duration-300 opacity-0 -translate-x-8 pointer-events-none">
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 mb-4 border-b border-orange-500/20">
            <div class="flex items-center gap-2.5">
                <i class="ph-fill ph-skull text-2xl text-orange-500"></i>
                <div>
                    <h1 class="font-spooky text-2xl text-orange-400 leading-none">Haunted Horizon</h1>
                    <p class="text-[11px] text-slate-400 mt-0.5">RGB Camera Motion Interactive Scene</p>
                </div>
            </div>
            <button id="closeHudBtn" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-white/10 transition-colors" title="Hide HUD (Shortcut: H or Double-Click)">
                <i class="ph-bold ph-x text-base"></i>
            </button>
        </div>

        <!-- Camera Control, Left/Right Inversion & Live RGB Diff Radar -->
        <div class="space-y-2.5 mb-5">
            <button id="cameraToggleBtn" class="w-full py-2.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white shadow-lg shadow-orange-950/50 transition-all">
                <i id="cameraBtnIcon" class="ph-fill ph-video-camera text-lg"></i>
                <span id="cameraBtnText">Start RGB Camera Motion</span>
            </button>

            <button id="flipCameraBtn" class="w-full py-2 px-3.5 rounded-xl font-medium text-xs flex items-center justify-between border border-orange-500/35 bg-orange-950/40 hover:bg-orange-900/50 text-orange-200 transition-all" title="Press F1 to invert left and right camera motion">
                <span class="flex items-center gap-2">
                    <i class="ph-bold ph-arrows-left-right text-orange-400 text-sm"></i>
                    <span>Camera Left / Right:</span>
                </span>
                <span id="flipStatusBadge" class="px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 font-mono text-[11px]">
                    Mirrored (Press F1)
                </span>
            </button>

            <div class="relative rounded-xl overflow-hidden border border-orange-500/25 bg-black/70 aspect-[4/3]">
                <canvas id="radarCanvas" width="160" height="120" class="w-full h-full object-cover"></canvas>
                <div class="absolute top-2 left-2 px-2 py-0.5 rounded bg-black/70 text-[10px] font-mono text-orange-300 border border-orange-500/20" id="radarHeaderLabel">
                    RGB Δ-MOTION RADAR (80×60 • MIRROR)
                </div>
                <div class="absolute bottom-2 right-2 px-2 py-0.5 rounded bg-black/70 text-[10px] font-mono text-emerald-300" id="motionMeterText">
                    Motion: 0%
                </div>
            </div>
        </div>

        <!-- Motion & Visual Sliders -->
        <div class="space-y-4 text-xs">
            <div>
                <div class="flex justify-between mb-1">
                    <label for="sensitivitySlider" class="text-slate-300 font-medium">RGB Motion Sensitivity</label>
                    <span id="sensitivityVal" class="text-orange-400 font-mono">65%</span>
                </div>
                <input id="sensitivitySlider" type="range" min="15" max="95" value="65" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between mb-1">
                    <label for="rgbTrailSlider" class="text-slate-300 font-medium">Chromatic RGB Ghost Trail</label>
                    <span id="rgbTrailVal" class="text-orange-400 font-mono">45%</span>
                </div>
                <input id="rgbTrailSlider" type="range" min="0" max="100" value="45" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>

            <div>
                <div class="flex justify-between mb-1">
                    <label for="entityDensitySlider" class="text-slate-300 font-medium">Spooky Swarm Density</label>
                    <span id="entityDensityVal" class="text-orange-400 font-mono">100%</span>
                </div>
                <input id="entityDensitySlider" type="range" min="40" max="180" value="100" class="w-full h-1.5 bg-slate-800 rounded-lg cursor-pointer">
            </div>

            <!-- Ghost Behavior Mode -->
            <div>
                <label class="block text-slate-300 font-medium mb-1.5">Specter Motion Response</label>
                <div class="grid grid-cols-3 gap-1.5" id="ghostModeGroup">
                    <button data-mode="swirl" class="ghost-mode-btn py-1.5 px-2 rounded-lg font-medium border border-orange-500/60 bg-orange-500/20 text-orange-200 transition-all">
                        Vortex Swirl
                    </button>
                    <button data-mode="attract" class="ghost-mode-btn py-1.5 px-2 rounded-lg font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition-all">
                        Haunt (Attract)
                    </button>
                    <button data-mode="repel" class="ghost-mode-btn py-1.5 px-2 rounded-lg font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition-all">
                        Scare (Repel)
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer Legend -->
        <div class="mt-5 pt-3 border-t border-white/10 flex flex-wrap items-center justify-between gap-1 text-[11px] text-slate-400">
            <span><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-slate-200">F1</kbd> Flip L/R</span>
            <span><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-slate-200">F11</kbd> Fullscreen</span>
            <span><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-slate-200">H</kbd> / <kbd class="px-1.5 py-0.5 bg-white/10 rounded text-slate-200">Dbl-Click</kbd> UI</span>
            <span><kbd class="px-1.5 py-0.5 bg-white/10 rounded text-slate-200">Space</kbd> Lightning</span>
        </div>
    </aside>

    <script>
        /**
         * HAUNTED HORIZON — Interactive RGB Webcam Motion Halloween Scene
         * Features:
         * - Real-time getUserMedia RGB frame-differencing on an 80x60 grid
         * - Instant Left/Right camera inversion via F1 (leaving F11 for Fullscreen)
         * - Starts with camera ON and all screen UI hidden by default
         * - Reactive bats, trailing ectoplasm ghosts, glowing Jack-o'-Lanterns,
         *   spooky silhouette trees, fog layers, and mouse/touch fallback.
         */
        function initHalloweenScene() {
            const canvas = document.getElementById('sceneCanvas');
            const ctx = canvas.getContext('2d');
            const video = document.getElementById('webcamVideo');
            const radarCanvas = document.getElementById('radarCanvas');
            const radarCtx = radarCanvas.getContext('2d');

            const GRID_W = 80;
            const GRID_H = 60;
            const procCanvas = document.createElement('canvas');
            procCanvas.width = GRID_W;
            procCanvas.height = GRID_H;
            const procCtx = procCanvas.getContext('2d', { willReadFrequently: true });

            const trailCanvas = document.createElement('canvas');
            trailCanvas.width = GRID_W;
            trailCanvas.height = GRID_H;
            const trailCtx = trailCanvas.getContext('2d');

            const state = {
                width: window.innerWidth,
                height: window.innerHeight,
                time: 0,
                cameraActive: false,
                cameraStarting: false,
                mirrorCamera: true, // True = normal mirror, False = inverted left/right (toggled via F1)
                stream: null,
                prevFrameData: null,
                sensitivity: 65,
                rgbTrailOpacity: 0.45,
                densityScale: 1.0,
                ghostMode: 'swirl',
                hudVisible: false,
                audioEnabled: false,
                audioCtx: null,
                masterGain: null,

                hotspot: {
                    x: window.innerWidth * 0.5,
                    y: window.innerHeight * 0.45,
                    vx: 0,
                    vy: 0,
                    intensity: 0,
                    active: false
                },
                motionPoints: [],

                pointer: {
                    x: window.innerWidth * 0.5,
                    y: window.innerHeight * 0.45,
                    prevX: window.innerWidth * 0.5,
                    prevY: window.innerHeight * 0.45,
                    speed: 0,
                    lastMoveTime: 0
                },

                stars: [],
                fogBands: [],
                bats: [],
                ghosts: [],
                pumpkins: [],
                particles: [],
                lightningFlash: 0,
                lightningBolt: null
            };

            function initAudio() {
                if (state.audioCtx) return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    state.audioCtx = new AudioContext();
                    state.masterGain = state.audioCtx.createGain();
                    state.masterGain.gain.value = 0.18;
                    state.masterGain.connect(state.audioCtx.destination);

                    const osc1 = state.audioCtx.createOscillator();
                    const osc2 = state.audioCtx.createOscillator();
                    const filter = state.audioCtx.createBiquadFilter();

                    osc1.type = 'sawtooth';
                    osc1.frequency.value = 55;
                    osc2.type = 'triangle';
                    osc2.frequency.value = 82.41;

                    filter.type = 'lowpass';
                    filter.frequency.value = 240;

                    osc1.connect(filter);
                    osc2.connect(filter);
                    filter.connect(state.masterGain);

                    osc1.start();
                    osc2.start();
                } catch (e) {
                    console.warn('Web Audio API unavailable:', e);
                }
            }

            function playThunderSound() {
                if (!state.audioEnabled || !state.audioCtx) return;
                try {
                    const now = state.audioCtx.currentTime;
                    const osc = state.audioCtx.createOscillator();
                    const gain = state.audioCtx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(120, now);
                    osc.frequency.exponentialRampToValueAtTime(28, now + 0.85);

                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

                    osc.connect(gain);
                    gain.connect(state.masterGain);
                    osc.start(now);
                    osc.stop(now + 0.92);
                } catch (e) {}
            }

            function initSceneEntities() {
                const w = state.width;
                const h = state.height;

                state.stars = [];
                for (let i = 0; i < 110; i++) {
                    state.stars.push({
                        x: Math.random() * w,
                        y: Math.random() * (h * 0.65),
                        r: Math.random() * 1.6 + 0.4,
                        alpha: Math.random() * 0.7 + 0.2,
                        twinkleSpeed: Math.random() * 0.04 + 0.01,
                        phase: Math.random() * Math.PI * 2
                    });
                }

                state.fogBands = [];
                for (let i = 0; i < 4; i++) {
                    state.fogBands.push({
                        y: h * (0.58 + i * 0.1),
                        amplitude: 16 + i * 7,
                        speed: (0.004 + i * 0.002) * (i % 2 === 0 ? 1 : -1),
                        offset: Math.random() * 100,
                        alpha: 0.11 + i * 0.03
                    });
                }

                state.pumpkins = [];
                const pumpkinCount = Math.max(5, Math.min(9, Math.floor(w / 190)));
                for (let i = 0; i < pumpkinCount; i++) {
                    const px = (w / (pumpkinCount + 1)) * (i + 1) + (Math.random() - 0.5) * 45;
                    const py = h - 34 - Math.random() * 24;
                    state.pumpkins.push({
                        x: px,
                        y: py,
                        radius: 25 + Math.random() * 13,
                        glow: 0.25,
                        excitement: 0,
                        seed: Math.random() * 100
                    });
                }

                syncDynamicSwarm();
            }

            function syncDynamicSwarm() {
                const w = state.width;
                const h = state.height;
                const targetBats = Math.round(28 * state.densityScale);
                const targetGhosts = Math.round(7 * state.densityScale);

                while (state.bats.length < targetBats) {
                    state.bats.push({
                        x: Math.random() * w,
                        y: Math.random() * (h * 0.62),
                        vx: (Math.random() - 0.5) * 2.6,
                        vy: (Math.random() - 0.5) * 1.2,
                        size: 9 + Math.random() * 9,
                        wingPhase: Math.random() * Math.PI * 2,
                        wingSpeed: 0.22 + Math.random() * 0.14,
                        scaredTimer: 0
                    });
                }
                if (state.bats.length > targetBats) state.bats.length = targetBats;

                while (state.ghosts.length < targetGhosts) {
                    const gx = Math.random() * w;
                    const gy = h * (0.2 + Math.random() * 0.55);
                    const trail = [];
                    for (let i = 0; i < 12; i++) trail.push({ x: gx, y: gy });
                    state.ghosts.push({
                        x: gx,
                        y: gy,
                        vx: (Math.random() - 0.5) * 1.5,
                        vy: (Math.random() - 0.5) * 1.1,
                        size: 22 + Math.random() * 14,
                        hue: 170 + Math.random() * 110,
                        phase: Math.random() * Math.PI * 2,
                        trail
                    });
                }
                if (state.ghosts.length > targetGhosts) state.ghosts.length = targetGhosts;
            }

            function spawnMotionParticle(x, y, vx, vy, type = 'ember') {
                if (state.particles.length > 260) return;
                const isEmber = type === 'ember';
                state.particles.push({
                    x: x + (Math.random() - 0.5) * 18,
                    y: y + (Math.random() - 0.5) * 18,
                    vx: vx * 0.18 + (Math.random() - 0.5) * 2.2,
                    vy: vy * 0.18 - Math.random() * 2.4 - 0.5,
                    r: isEmber ? Math.random() * 3.5 + 1.5 : Math.random() * 6 + 3,
                    life: 1.0,
                    decay: 0.016 + Math.random() * 0.02,
                    color: isEmber
                        ? (Math.random() < 0.6 ? '#f97316' : '#facc15')
                        : (Math.random() < 0.5 ? '#a855f7' : '#2dd4bf')
                });
            }

            function triggerLightning() {
                state.lightningFlash = 0.85;
                const startX = state.width * (0.2 + Math.random() * 0.6);
                const segments = [];
                let cx = startX;
                let cy = 0;
                while (cy < state.height * 0.68) {
                    const nx = cx + (Math.random() - 0.5) * 65;
                    const ny = cy + 22 + Math.random() * 32;
                    segments.push({ x1: cx, y1: cy, x2: nx, y2: ny });
                    cx = nx;
                    cy = ny;
                }
                state.lightningBolt = { segments, alpha: 1.0 };

                for (const bat of state.bats) {
                    bat.scaredTimer = 50;
                    bat.vx = (Math.random() - 0.5) * 9;
                    bat.vy = -Math.random() * 5 - 1.5;
                }
                playThunderSound();
            }

            async function toggleCamera() {
                if (state.cameraStarting) return;
                if (state.cameraActive) {
                    stopCamera();
                    return;
                }
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    updateStatusUI('fallback', 'Webcam API Unsupported — Mouse/Touch Active');
                    return;
                }

                state.cameraStarting = true;
                updateStatusUI('starting', 'Starting RGB Camera...');

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 320 }, height: { ideal: 240 }, facingMode: 'user' },
                        audio: false
                    });
                    state.stream = stream;
                    video.srcObject = stream;
                    await video.play();

                    state.cameraActive = true;
                    state.cameraStarting = false;
                    state.prevFrameData = null;

                    updateStatusUI('active', 'RGB Camera Active');
                    const btn = document.getElementById('cameraToggleBtn');
                    btn.className = 'w-full py-2.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 bg-gradient-to-r from-rose-600 to-red-600 hover:from-rose-500 hover:to-red-500 text-white shadow-lg shadow-rose-950/50 transition-all';
                    document.getElementById('cameraBtnIcon').className = 'ph-fill ph-video-camera-slash text-lg';
                    document.getElementById('cameraBtnText').textContent = 'Stop RGB Camera';
                } catch (err) {
                    state.cameraActive = false;
                    state.cameraStarting = false;
                    updateStatusUI('fallback', 'Mouse / Touch Fallback Active');
                }
            }

            function stopCamera() {
                if (state.stream) {
                    state.stream.getTracks().forEach(track => track.stop());
                    state.stream = null;
                }
                video.srcObject = null;
                state.cameraActive = false;
                state.prevFrameData = null;
                updateStatusUI('fallback', 'Mouse / Touch Fallback Active');
                const btn = document.getElementById('cameraToggleBtn');
                btn.className = 'w-full py-2.5 px-4 rounded-xl font-semibold text-sm flex items-center justify-center gap-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white shadow-lg shadow-orange-950/50 transition-all';
                document.getElementById('cameraBtnIcon').className = 'ph-fill ph-video-camera text-lg';
                document.getElementById('cameraBtnText').textContent = 'Start RGB Camera Motion';
            }

            function toggleCameraMirror() {
                state.mirrorCamera = !state.mirrorCamera;
                state.prevFrameData = null;

                const flipStatusBadge = document.getElementById('flipStatusBadge');
                const flipQuickLabel = document.getElementById('flipQuickLabel');
                const radarHeaderLabel = document.getElementById('radarHeaderLabel');

                if (state.mirrorCamera) {
                    flipStatusBadge.textContent = 'Mirrored (Press F1)';
                    flipStatusBadge.className = 'px-2 py-0.5 rounded bg-orange-500/20 text-orange-300 font-mono text-[11px]';
                    flipQuickLabel.textContent = 'L/R: Mirrored';
                    radarHeaderLabel.textContent = 'RGB Δ-MOTION RADAR (80×60 • MIRROR)';
                } else {
                    flipStatusBadge.textContent = 'Inverted L/R (Press F1)';
                    flipStatusBadge.className = 'px-2 py-0.5 rounded bg-purple-500/25 text-purple-300 font-mono text-[11px]';
                    flipQuickLabel.textContent = 'L/R: Inverted';
                    radarHeaderLabel.textContent = 'RGB Δ-MOTION RADAR (80×60 • INVERTED)';
                }
            }

            function updateStatusUI(mode, message) {
                const dot = document.getElementById('statusDot');
                const dotSolid = document.getElementById('statusDotSolid');
                const label = document.getElementById('statusLabel');
                label.textContent = message;
                if (mode === 'active') {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping';
                    dotSolid.className = 'w-2.5 h-2.5 rounded-full bg-emerald-400 -ml-4';
                    label.className = 'text-emerald-200';
                } else if (mode === 'starting') {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping';
                    dotSolid.className = 'w-2.5 h-2.5 rounded-full bg-amber-400 -ml-4';
                    label.className = 'text-amber-200';
                } else {
                    dot.className = 'w-2.5 h-2.5 rounded-full bg-orange-400 animate-ping';
                    dotSolid.className = 'w-2.5 h-2.5 rounded-full bg-orange-400 -ml-4';
                    label.className = 'text-orange-200';
                }
            }

            function processRgbMotionFrame() {
                state.motionPoints = [];
                trailCtx.fillStyle = 'rgba(7, 3, 13, 0.18)';
                trailCtx.fillRect(0, 0, GRID_W, GRID_H);

                if (state.cameraActive && video.readyState >= 2) {
                    procCtx.save();
                    if (state.mirrorCamera) {
                        procCtx.scale(-1, 1);
                        procCtx.drawImage(video, -GRID_W, 0, GRID_W, GRID_H);
                    } else {
                        procCtx.drawImage(video, 0, 0, GRID_W, GRID_H);
                    }
                    procCtx.restore();

                    const frame = procCtx.getImageData(0, 0, GRID_W, GRID_H);
                    const data = frame.data;
                    const diffThreshold = Math.max(18, 145 - state.sensitivity * 1.28);

                    let sumX = 0;
                    let sumY = 0;
                    let totalWeight = 0;
                    let activePixels = 0;

                    const trailImg = trailCtx.getImageData(0, 0, GRID_W, GRID_H);
                    const trailData = trailImg.data;

                    if (state.prevFrameData) {
                        const prev = state.prevFrameData;
                        for (let y = 0; y < GRID_H; y++) {
                            for (let x = 0; x < GRID_W; x++) {
                                const idx = (y * GRID_W + x) * 4;
                                const dR = Math.abs(data[idx] - prev[idx]);
                                const dG = Math.abs(data[idx + 1] - prev[idx + 1]);
                                const dB = Math.abs(data[idx + 2] - prev[idx + 2]);
                                const rgbDiff = dR + dG + dB;

                                if (rgbDiff > diffThreshold) {
                                    const weight = Math.min(1, (rgbDiff - diffThreshold) / 200);
                                    sumX += x * weight;
                                    sumY += y * weight;
                                    totalWeight += weight;
                                    activePixels++;

                                    trailData[idx] = Math.min(255, trailData[idx] + dR * 1.5 + 80);
                                    trailData[idx + 1] = Math.min(255, trailData[idx + 1] + dG * 0.9 + 20);
                                    trailData[idx + 2] = Math.min(255, trailData[idx + 2] + dB * 1.6 + 110);
                                    trailData[idx + 3] = Math.min(255, trailData[idx + 3] + Math.floor(weight * 220));

                                    if ((x + y) % 5 === 0 && weight > 0.35) {
                                        state.motionPoints.push({
                                            x: (x / GRID_W) * state.width,
                                            y: (y / GRID_H) * state.height,
                                            weight
                                        });
                                    }
                                }
                            }
                        }
                    }

                    trailCtx.putImageData(trailImg, 0, 0);
                    state.prevFrameData = new Uint8ClampedArray(data);

                    const normalizedActivity = Math.min(1, activePixels / (GRID_W * GRID_H * 0.18));
                    document.getElementById('motionMeterText').textContent = `Motion: ${Math.round(normalizedActivity * 100)}%`;

                    if (totalWeight > 2.2) {
                        const targetX = (sumX / totalWeight / GRID_W) * state.width;
                        const targetY = (sumY / totalWeight / GRID_H) * state.height;

                        state.hotspot.vx = (targetX - state.hotspot.x) * 0.35;
                        state.hotspot.vy = (targetY - state.hotspot.y) * 0.35;
                        state.hotspot.x += state.hotspot.vx;
                        state.hotspot.y += state.hotspot.vy;
                        state.hotspot.intensity = Math.min(1, normalizedActivity * 1.6);
                        state.hotspot.active = true;

                        for (let i = 0; i < state.motionPoints.length; i++) {
                            if (Math.random() < 0.32) {
                                const pt = state.motionPoints[i];
                                spawnMotionParticle(pt.x, pt.y, state.hotspot.vx, state.hotspot.vy, Math.random() < 0.7 ? 'ember' : 'ectoplasm');
                            }
                        }
                    } else {
                        state.hotspot.intensity *= 0.9;
                        if (state.hotspot.intensity < 0.05) state.hotspot.active = false;
                    }

                    radarCtx.clearRect(0, 0, radarCanvas.width, radarCanvas.height);
                    radarCtx.globalAlpha = 0.45;
                    radarCtx.drawImage(procCanvas, 0, 0, radarCanvas.width, radarCanvas.height);
                    radarCtx.globalAlpha = 0.95;
                    radarCtx.drawImage(trailCanvas, 0, 0, radarCanvas.width, radarCanvas.height);
                    radarCtx.globalAlpha = 1;
                } else {
                    const elapsed = performance.now() - state.pointer.lastMoveTime;
                    if (elapsed < 350) {
                        state.hotspot.vx = (state.pointer.x - state.hotspot.x) * 0.32;
                        state.hotspot.vy = (state.pointer.y - state.hotspot.y) * 0.32;
                        state.hotspot.x += state.hotspot.vx;
                        state.hotspot.y += state.hotspot.vy;
                        state.hotspot.intensity = Math.min(1, Math.max(0.25, state.pointer.speed / 28));
                        state.hotspot.active = true;

                        const gx = Math.floor((state.hotspot.x / state.width) * GRID_W);
                        const gy = Math.floor((state.hotspot.y / state.height) * GRID_H);
                        const grad = trailCtx.createRadialGradient(gx, gy, 1, gx, gy, 7);
                        grad.addColorStop(0, 'rgba(249, 115, 22, 0.9)');
                        grad.addColorStop(0.5, 'rgba(168, 85, 247, 0.55)');
                        grad.addColorStop(1, 'rgba(45, 212, 191, 0)');
                        trailCtx.fillStyle = grad;
                        trailCtx.beginPath();
                        trailCtx.arc(gx, gy, 7, 0, Math.PI * 2);
                        trailCtx.fill();

                        if (Math.random() < 0.65) {
                            spawnMotionParticle(state.hotspot.x, state.hotspot.y, state.hotspot.vx, state.hotspot.vy, Math.random() < 0.7 ? 'ember' : 'ectoplasm');
                        }
                    } else {
                        state.hotspot.intensity *= 0.92;
                        if (state.hotspot.intensity < 0.04) state.hotspot.active = false;
                    }

                    document.getElementById('motionMeterText').textContent = `Pointer: ${Math.round(state.hotspot.intensity * 100)}%`;
                    radarCtx.fillStyle = '#090412';
                    radarCtx.fillRect(0, 0, radarCanvas.width, radarCanvas.height);
                    radarCtx.drawImage(trailCanvas, 0, 0, radarCanvas.width, radarCanvas.height);
                }
            }

            function drawNightSkyAndMoon(w, h) {
                const skyGrad = ctx.createLinearGradient(0, 0, 0, h);
                skyGrad.addColorStop(0, '#07030f');
                skyGrad.addColorStop(0.45, '#160929');
                skyGrad.addColorStop(0.78, '#28103d');
                skyGrad.addColorStop(1, '#12071c');
                ctx.fillStyle = skyGrad;
                ctx.fillRect(0, 0, w, h);

                for (const s of state.stars) {
                    const tw = Math.sin(state.time * 60 * s.twinkleSpeed + s.phase) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(254, 243, 199, ${s.alpha * tw})`;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fill();
                }

                const moonX = w * 0.78;
                const moonY = h * 0.22;
                const moonRadius = Math.min(w, h) * 0.095;
                const motionPulse = state.hotspot.active ? state.hotspot.intensity * 26 : 0;

                const haloGrad = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.5, moonX, moonY, moonRadius * 3.1 + motionPulse);
                haloGrad.addColorStop(0, 'rgba(251, 146, 60, 0.45)');
                haloGrad.addColorStop(0.45, 'rgba(234, 88, 12, 0.18)');
                haloGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');
                ctx.fillStyle = haloGrad;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius * 3.1 + motionPulse, 0, Math.PI * 2);
                ctx.fill();

                const moonGrad = ctx.createRadialGradient(moonX - moonRadius * 0.2, moonY - moonRadius * 0.2, moonRadius * 0.1, moonX, moonY, moonRadius);
                moonGrad.addColorStop(0, '#fff7ed');
                moonGrad.addColorStop(0.65, '#fed7aa');
                moonGrad.addColorStop(1, '#f97316');
                ctx.fillStyle = moonGrad;
                ctx.beginPath();
                ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
                ctx.fill();
            }

            function drawRgbMotionSilhouette(w, h) {
                if (state.rgbTrailOpacity <= 0.01) return;
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                ctx.globalAlpha = state.rgbTrailOpacity;
                ctx.filter = 'blur(10px)';
                ctx.drawImage(trailCanvas, 0, 0, w, h);
                ctx.filter = 'none';
                ctx.restore();
            }

            function drawHillsAndGraveyard(w, h) {
                ctx.fillStyle = '#11071f';
                ctx.beginPath();
                ctx.moveTo(0, h);
                for (let x = 0; x <= w; x += 40) {
                    const y = h * 0.72 + Math.sin(x * 0.003 + 1.2) * 38;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w, h);
                ctx.closePath();
                ctx.fill();

                for (const fog of state.fogBands) {
                    ctx.save();
                    const grad = ctx.createLinearGradient(0, fog.y - 45, 0, fog.y + 65);
                    grad.addColorStop(0, 'rgba(168, 85, 247, 0)');
                    grad.addColorStop(0.5, `rgba(139, 92, 246, ${fog.alpha})`);
                    grad.addColorStop(1, 'rgba(15, 7, 28, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, h);
                    for (let x = 0; x <= w; x += 35) {
                        const waveY = fog.y + Math.sin(x * 0.008 + state.time * 60 * fog.speed + fog.offset) * fog.amplitude;
                        ctx.lineTo(x, waveY);
                    }
                    ctx.lineTo(w, h);
                    ctx.closePath();
                    ctx.fill();
                    ctx.restore();
                }

                ctx.fillStyle = '#05020a';
                ctx.beginPath();
                ctx.moveTo(0, h);
                for (let x = 0; x <= w; x += 50) {
                    const y = h - 42 + Math.sin(x * 0.008) * 14;
                    ctx.lineTo(x, y);
                }
                ctx.lineTo(w, h);
                ctx.closePath();
                ctx.fill();
            }

            function updateAndDrawPumpkins() {
                for (const p of state.pumpkins) {
                    if (state.hotspot.active) {
                        const dist = Math.hypot(state.hotspot.x - p.x, state.hotspot.y - p.y);
                        if (dist < 220) {
                            const boost = ((220 - dist) / 220) * state.hotspot.intensity;
                            p.excitement = Math.min(1.5, p.excitement + boost * 0.25);
                        }
                    }
                    p.excitement *= 0.94;
                    const r = p.radius;
                    const flicker = 0.75 + Math.sin(state.time * 18 + p.seed) * 0.15 + p.excitement * 0.6;

                    ctx.save();
                    ctx.translate(p.x, p.y);

                    const auraRadius = r * (2.1 + p.excitement * 1.4);
                    const auraGrad = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, auraRadius);
                    auraGrad.addColorStop(0, `rgba(251, 146, 60, ${0.42 * flicker})`);
                    auraGrad.addColorStop(1, 'rgba(234, 88, 12, 0)');
                    ctx.fillStyle = auraGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, auraRadius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#9a3412';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 1.12, r * 0.86, 0, 0, Math.PI * 2);
                    ctx.fill();

                    const eyeGlow = p.excitement > 0.2 ? '#fef08a' : '#fbbf24';
                    ctx.fillStyle = eyeGlow;
                    ctx.beginPath();
                    ctx.moveTo(-r * 0.48, -r * 0.12);
                    ctx.lineTo(-r * 0.26, -r * 0.42);
                    ctx.lineTo(-r * 0.12, -r * 0.12);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(r * 0.48, -r * 0.12);
                    ctx.lineTo(r * 0.26, -r * 0.42);
                    ctx.lineTo(r * 0.12, -r * 0.12);
                    ctx.closePath();
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(0, r * 0.08, r * 0.56, 0.15 * Math.PI, 0.85 * Math.PI);
                    ctx.fill();

                    ctx.restore();
                }
            }

            function updateAndDrawGhosts(w, h) {
                for (const g of state.ghosts) {
                    g.phase += 0.05;
                    if (state.hotspot.active) {
                        const dx = state.hotspot.x - g.x;
                        const dy = state.hotspot.y - g.y;
                        const dist = Math.max(1, Math.hypot(dx, dy));
                        const force = Math.min(1, 280 / dist) * state.hotspot.intensity;

                        if (state.ghostMode === 'attract') {
                            g.vx += (dx / dist) * force * 0.38;
                            g.vy += (dy / dist) * force * 0.38;
                        } else if (state.ghostMode === 'repel') {
                            g.vx -= (dx / dist) * force * 0.55;
                            g.vy -= (dy / dist) * force * 0.55;
                        } else {
                            const tx = -dy / dist;
                            const ty = dx / dist;
                            g.vx += (tx * 0.45 + (dx / dist) * 0.14) * force;
                            g.vy += (ty * 0.45 + (dy / dist) * 0.14) * force;
                        }
                    }

                    g.vx *= 0.96;
                    g.vy *= 0.96;
                    g.x += g.vx;
                    g.y += g.vy;

                    if (g.x < -60) g.x = w + 60;
                    if (g.x > w + 60) g.x = -60;
                    if (g.y < 40) g.vy += 0.2;
                    if (g.y > h - 90) g.vy -= 0.2;

                    g.trail.unshift({ x: g.x, y: g.y });
                    if (g.trail.length > 12) g.trail.pop();

                    ctx.save();
                    for (let i = g.trail.length - 1; i >= 0; i--) {
                        const pt = g.trail[i];
                        const ratio = 1 - i / g.trail.length;
                        ctx.fillStyle = `hsla(${g.hue}, 85%, 72%, ${ratio * 0.22})`;
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, g.size * ratio * 0.85, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    ctx.translate(g.x, g.y);
                    ctx.fillStyle = `hsla(${g.hue}, 90%, 88%, 0.78)`;
                    ctx.beginPath();
                    ctx.arc(0, 0, g.size * 0.65, Math.PI, 0);
                    ctx.lineTo(g.size * 0.65, g.size * 0.6);
                    ctx.lineTo(-g.size * 0.65, g.size * 0.6);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = '#090414';
                    ctx.beginPath();
                    ctx.arc(-g.size * 0.22, -g.size * 0.08, g.size * 0.11, 0, Math.PI * 2);
                    ctx.arc(g.size * 0.22, -g.size * 0.08, g.size * 0.11, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function updateAndDrawBats(w, h) {
                for (const b of state.bats) {
                    if (state.hotspot.active) {
                        const dx = b.x - state.hotspot.x;
                        const dy = b.y - state.hotspot.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < 170 && dist > 1) {
                            const push = ((170 - dist) / 170) * state.hotspot.intensity;
                            b.vx += (dx / dist) * push * 2.4;
                            b.vy += (dy / dist) * push * 2.4;
                            b.scaredTimer = 30;
                        }
                    }

                    if (b.scaredTimer > 0) b.scaredTimer--;
                    const maxSpeed = b.scaredTimer > 0 ? 7.5 : 3.2;
                    const speed = Math.hypot(b.vx, b.vy);
                    if (speed > maxSpeed) {
                        b.vx = (b.vx / speed) * maxSpeed;
                        b.vy = (b.vy / speed) * maxSpeed;
                    }

                    b.x += b.vx;
                    b.y += b.vy;
                    b.wingPhase += b.wingSpeed * (b.scaredTimer > 0 ? 1.8 : 1);

                    if (b.x < -30) b.x = w + 30;
                    if (b.x > w + 30) b.x = -30;
                    if (b.y < 20) b.vy += 0.15;
                    if (b.y > h * 0.72) b.vy -= 0.2;

                    const flap = Math.sin(b.wingPhase) * b.size * 0.85;
                    ctx.save();
                    ctx.translate(b.x, b.y);
                    ctx.rotate(Math.atan2(b.vy, b.vx) * 0.25);
                    ctx.fillStyle = '#090412';
                    ctx.beginPath();
                    ctx.arc(0, 0, b.size * 0.28, 0, Math.PI * 2);
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(-b.size * 0.8, -flap, -b.size * 1.45, flap * 0.35);
                    ctx.quadraticCurveTo(-b.size * 0.7, b.size * 0.3, 0, b.size * 0.15);
                    ctx.moveTo(0, 0);
                    ctx.quadraticCurveTo(b.size * 0.8, -flap, b.size * 1.45, flap * 0.35);
                    ctx.quadraticCurveTo(b.size * 0.7, b.size * 0.3, 0, b.size * 0.15);
                    ctx.fill();
                    ctx.restore();
                }
            }

            function updateAndDrawParticles() {
                ctx.save();
                ctx.globalCompositeOperation = 'screen';
                for (let i = state.particles.length - 1; i >= 0; i--) {
                    const p = state.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= p.decay;
                    if (p.life <= 0) {
                        state.particles.splice(i, 1);
                        continue;
                    }
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            function drawLightningOverlay(w, h) {
                if (state.lightningBolt && state.lightningBolt.alpha > 0) {
                    ctx.save();
                    ctx.strokeStyle = `rgba(243, 232, 255, ${state.lightningBolt.alpha})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    for (const seg of state.lightningBolt.segments) {
                        ctx.moveTo(seg.x1, seg.y1);
                        ctx.lineTo(seg.x2, seg.y2);
                    }
                    ctx.stroke();
                    ctx.restore();
                    state.lightningBolt.alpha -= 0.06;
                }
                if (state.lightningFlash > 0) {
                    ctx.fillStyle = `rgba(250, 245, 255, ${state.lightningFlash * 0.35})`;
                    ctx.fillRect(0, 0, w, h);
                    state.lightningFlash = Math.max(0, state.lightningFlash - 0.05);
                }
            }

            function animate() {
                state.time += 0.016;
                const w = state.width;
                const h = state.height;

                processRgbMotionFrame();
                drawNightSkyAndMoon(w, h);
                drawRgbMotionSilhouette(w, h);
                drawHillsAndGraveyard(w, h);
                updateAndDrawPumpkins();
                updateAndDrawGhosts(w, h);
                updateAndDrawBats(w, h);
                updateAndDrawParticles();
                drawLightningOverlay(w, h);

                requestAnimationFrame(animate);
            }

            function handleResize() {
                state.width = window.innerWidth;
                state.height = window.innerHeight;
                canvas.width = state.width;
                canvas.height = state.height;
                initSceneEntities();
            }

            window.addEventListener('resize', handleResize);

            function handlePointerMove(clientX, clientY) {
                const dx = clientX - state.pointer.x;
                const dy = clientY - state.pointer.y;
                state.pointer.speed = Math.hypot(dx, dy);
                state.pointer.prevX = state.pointer.x;
                state.pointer.prevY = state.pointer.y;
                state.pointer.x = clientX;
                state.pointer.y = clientY;
                state.pointer.lastMoveTime = performance.now();
            }

            window.addEventListener('mousemove', (e) => handlePointerMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (e.touches.length > 0) {
                    handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            function toggleHud() {
                state.hudVisible = !state.hudVisible;
                const panel = document.getElementById('hudPanel');
                const topLeftBar = document.getElementById('topLeftBar');
                const topRightBar = document.getElementById('topRightBar');
                const toggleText = document.getElementById('toggleHudText');

                if (state.hudVisible) {
                    panel.classList.remove('opacity-0', '-translate-x-8', 'pointer-events-none');
                    topLeftBar.classList.remove('opacity-0', 'pointer-events-none');
                    topRightBar.classList.remove('opacity-0', 'pointer-events-none');
                    toggleText.textContent = 'Hide Controls';
                } else {
                    panel.classList.add('opacity-0', '-translate-x-8', 'pointer-events-none');
                    topLeftBar.classList.add('opacity-0', 'pointer-events-none');
                    topRightBar.classList.add('opacity-0', 'pointer-events-none');
                    toggleText.textContent = 'Controls';
                }
            }

            canvas.addEventListener('dblclick', toggleHud);
            document.getElementById('toggleHudBtn').addEventListener('click', toggleHud);
            document.getElementById('closeHudBtn').addEventListener('click', toggleHud);
            document.getElementById('cameraToggleBtn').addEventListener('click', toggleCamera);
            document.getElementById('flipCameraBtn').addEventListener('click', toggleCameraMirror);
            document.getElementById('flipCameraQuickBtn').addEventListener('click', toggleCameraMirror);
            document.getElementById('lightningBtn').addEventListener('click', () => triggerLightning());

            document.getElementById('audioToggleBtn').addEventListener('click', () => {
                initAudio();
                state.audioEnabled = !state.audioEnabled;
                if (state.audioCtx && state.audioCtx.state === 'suspended') {
                    state.audioCtx.resume();
                }
                if (state.masterGain) {
                    state.masterGain.gain.value = state.audioEnabled ? 0.18 : 0;
                }
                const icon = document.getElementById('audioIcon');
                const label = document.getElementById('audioLabel');
                if (state.audioEnabled) {
                    icon.className = 'ph-fill ph-speaker-high text-orange-400 text-lg';
                    label.textContent = 'Sound On';
                } else {
                    icon.className = 'ph-fill ph-speaker-slash text-slate-400 text-lg';
                    label.textContent = 'Sound Off';
                }
            });

            document.getElementById('sensitivitySlider').addEventListener('input', (e) => {
                state.sensitivity = Number(e.target.value);
                document.getElementById('sensitivityVal').textContent = `${state.sensitivity}%`;
            });

            document.getElementById('rgbTrailSlider').addEventListener('input', (e) => {
                const val = Number(e.target.value);
                state.rgbTrailOpacity = val / 100;
                document.getElementById('rgbTrailVal').textContent = `${val}%`;
            });

            document.getElementById('entityDensitySlider').addEventListener('input', (e) => {
                const val = Number(e.target.value);
                state.densityScale = val / 100;
                document.getElementById('entityDensityVal').textContent = `${val}%`;
                syncDynamicSwarm();
            });

            document.querySelectorAll('.ghost-mode-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    state.ghostMode = btn.dataset.mode;
                    document.querySelectorAll('.ghost-mode-btn').forEach(b => {
                        if (b.dataset.mode === state.ghostMode) {
                            b.className = 'ghost-mode-btn py-1.5 px-2 rounded-lg font-medium border border-orange-500/60 bg-orange-500/20 text-orange-200 transition-all';
                        } else {
                            b.className = 'ghost-mode-btn py-1.5 px-2 rounded-lg font-medium border border-white/10 bg-white/5 text-slate-300 hover:bg-white/10 transition-all';
                        }
                    });
                });
            });

            // Keyboard Shortcuts:
            // - F1 exclusively inverts Left/Right on the camera (F11 is untouched for Fullscreen)
            // - H toggles the hidden HUD
            // - Space triggers Thunder Scare
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F1') {
                    e.preventDefault();
                    toggleCameraMirror();
                } else if (e.key === 'h' || e.key === 'H') {
                    toggleHud();
                } else if (e.code === 'Space') {
                    e.preventDefault();
                    triggerLightning();
                }
            });

            handleResize();
            requestAnimationFrame(animate);
            toggleCamera();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initHalloweenScene);
        } else {
            initHalloweenScene();
        }
    </script>
</body>
</html>
